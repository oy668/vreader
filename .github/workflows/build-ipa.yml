name: Build VReader IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本仓库为 Xcode 16.0 编写。16.3+ 会把 actor 隔离检查强制为错误（Swift5 也压不住），
      # 因此必须选最旧的那个 Xcode 16.x（优先 16.0/16.1/16.2）。同时打印所有可用版本便于排查。
      - name: Select oldest Xcode 16
        run: |
          for d in $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V); do
            v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$d/Contents/Info.plist" 2>/dev/null)
            echo "Available Xcode: $v -> $d"
          done
          XCODE16="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | head -1)"
          echo ">>> Selecting: $XCODE16"
          if [ -n "$XCODE16" ]; then sudo xcode-select -s "$XCODE16"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Apply fixes (3.9.0->3.10.0, Swift 5 mode)
        run: |
          perl -pi -e 's/exactVersion: "3.9.0"/exactVersion: "3.10.0"/' project.yml
          perl -pi -e 's/SWIFT_VERSION: "6.0"/SWIFT_VERSION: "5.0"/' project.yml
          perl -pi -e 's/SWIFT_STRICT_CONCURRENCY: complete/SWIFT_STRICT_CONCURRENCY: minimal/' project.yml
          grep -nE "exactVersion|SWIFT_VERSION|SWIFT_STRICT_CONCURRENCY" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Release)
        run: |
          xcodebuild \
            -project vreader.xcodeproj \
            -scheme vreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr vreader.ipa Payload
          ls -lh vreader.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vreader-ipa
          path: vreader.ipa
