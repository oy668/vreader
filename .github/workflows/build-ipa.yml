name: Build VReader IPA

# 在 GitHub 免费 macOS 运行器上编译 VReader 并产出 IPA（免本机 Mac）。
# 本 workflow 已内置本地排查出的两个修复：
#   1) swift-toolkit 3.9.0 在远端不存在 → 自动改成真实存在的 3.10.0；
#   2) 项目默认 Swift 6 + strict concurrency 有 30+ 并发错误 → 自动切 Swift 5 模式降级为警告。
# 用法：推到你的 GitHub 仓库 → Actions → Run workflow → 下载 vreader-ipa 里的 vreader.ipa。
# 该 IPA 为未签名构建：越狱+TrollStore 直接导入；普通设备用 Sideloadly/AltStore 用 Apple ID 签名侧载。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-15        # macOS 运行器，预装完整 Xcode 16.x + iOS SDK
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # 修复 1：把不存在的 swift-toolkit 3.9.0 改为真实存在的 3.10.0
      - name: Fix Readium version (3.9.0 -> 3.10.0)
        run: |
          sed -i 's/exactVersion: "3.9.0"/exactVersion: "3.10.0"/' project.yml || true
          grep -n "exactVersion" project.yml

      # 修复 2：Swift 6 严格并发有大量错误 -> 切 Swift 5 语言模式 + 宽松并发，降级为警告
      - name: Relax Swift concurrency (Swift 5 mode)
        run: |
          sed -i 's/SWIFT_VERSION: "6.0"/SWIFT_VERSION: "5.0"/' project.yml || true
          sed -i 's/SWIFT_STRICT_CONCURRENCY: complete/SWIFT_STRICT_CONCURRENCY: minimal/' project.yml || true
          grep -n "SWIFT_VERSION\|SWIFT_STRICT_CONCURRENCY" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      # 无签名 Release 构建（TrollStore / 自签侧载用），同时再传一次 Swift5 开关做双保险
      - name: Build (unsigned, Release)
        run: |
          xcodebuild \
            -project vreader.xcodeproj \
            -scheme vreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          echo "Packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr vreader.ipa Payload
          ls -lh vreader.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vreader-ipa
          path: vreader.ipa
